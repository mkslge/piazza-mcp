name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev

      - name: Run tests
        run: uv run --frozen pytest -q

  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.14"
          enable-cache: true

      - name: Verify lockfile
        run: uv lock --check

      - name: Check whitespace
        run: git diff --check

      - name: Install locked dependencies
        run: uv sync --locked --all-extras --dev

      - name: Check test quality anti-patterns
        run: uv run --frozen python scripts/check_test_quality.py tests

      - name: Compile Python sources
        run: uv run --frozen python -m compileall -q src/piazza_mcp tests scripts

  package:
    name: Build and smoke-test package
    needs:
      - test
      - quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
          python-version: "3.14"
          enable-cache: true

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify distribution artifacts
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          source_distributions=(dist/*.tar.gz)
          if (( ${#wheels[@]} != 1 || ${#source_distributions[@]} != 1 )); then
            echo "Expected exactly one wheel and one source distribution"
            exit 1
          fi

      - name: Smoke-test installed wheel
        run: |
          smoke_root="$(mktemp -d)"
          uv venv "$smoke_root/venv" --python 3.14
          uv pip install --python "$smoke_root/venv/bin/python" dist/*.whl
          (
            cd "$smoke_root"
            "$smoke_root/venv/bin/python" -c \
              "import piazza_mcp; import piazza_mcp.server"
            test -x "$smoke_root/venv/bin/piazza-mcp"
          )

      - name: Upload distributions
        if: >-
          github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/') ||
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: piazza-mcp-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
