[project]
name = "piazza-mcp"
version = "0.1.0"
description = "Read-only MCP server for configured Piazza discussions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
 "beautifulsoup4>=4.13,<5",
 "mcp>=1.28.1,<2",
 "piazza-api>=0.16.0,<0.17.0",
 "requests>=2.32,<3",
]
[[project.authors]]
name = "mkslge"
email = "marklseeliger@gmail.com"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = [ "uv_build>=0.11.28,<0.12.0",]
build-backend = "uv_build"

[project.scripts]
piazza-mcp = "piazza_mcp:main"
